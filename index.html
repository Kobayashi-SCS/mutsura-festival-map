<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文化祭 フロアマップ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 id="title">文化祭 フロアマップ</h1>
  <div class="search">
    <input id="q" type="search" placeholder="出し物・教室・トイレを検索" autocomplete="off" aria-label="検索">
  </div>
</header>

<main>
  <section id="results" hidden></section>
  <section id="view"></section>
</main>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button id="sheet-close" class="close" aria-label="閉じる">✕</button>
    <div id="sheet-body"></div>
  </div>
</div>

<footer>
  <p>配置や出し物は変更になる場合があります。</p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
