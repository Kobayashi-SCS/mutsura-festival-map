
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六浦祭2026 フロアマップ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Noto Sans JP", sans-serif;
  background: #102d32;
  color: white;
}

header {
  text-align: center;
  padding: 22px;
  background: #173e43;
  border-bottom: 3px solid #d7b76a;
}

header h1 {
  margin: 0;
  color: #f4d98b;
}

header p {
  margin: 6px 0 0;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

/* 2D・3D切り替え */
.toolbar {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 18px;
}

.toolbar button {
  padding: 10px 25px;
  border: 1px solid #d7b76a;
  border-radius: 8px;
  background: #234d52;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.toolbar button.active {
  background: #d7b76a;
  color: #18383c;
  font-weight: bold;
}

/* 全体マップ */
.map-frame {
  padding: 12px;
  overflow: hidden;
  background: #e9eee8;
  border: 4px solid #d7b76a;
  border-radius: 12px;
}

.map {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 2;
  min-height: 500px;
  overflow: hidden;
  background: #dce8d2;
  border: 3px solid #879c83;
  transition: transform .5s;
  transform-style: preserve-3d;
}

.map.is3d {
  transform: perspective(1200px) rotateX(20deg) scale(.94);
}

/* 道路 */
.road {
  position: absolute;
  z-index: 1;
  background: #a7aaa8;
  border: 2px solid #858987;
}

.road.horizontal {
  left: 0;
  top: 46%;
  width: 100%;
  height: 6%;
}

.road.horizontal::after {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  width: 100%;
  border-top: 2px dashed white;
}

/* 建物共通 */
.building {
  position: absolute;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 5px;
  border: 3px solid #59665f;
  border-radius: 3px;
  color: #263d36;
  font-weight: bold;
  font-size: clamp(12px, 1.5vw, 20px);
  cursor: pointer;
  box-shadow: 5px 6px 0 rgba(0,0,0,.18);
  transition: filter .2s, transform .2s;
}

.building:hover {
  filter: brightness(1.08);
  transform: translateY(-3px);
}

.school-2 {
  left: 15%;
  top: 5%;
  width: 34%;
  height: 23%;
  background: #fff0c9;
}

.high-school {
  left: 51%;
  top: 5%;
  width: 34%;
  height: 23%;
  background: #f3cccc;
}

.building-4 {
  left: 2%;
  top: 31%;
  width: 10%;
  height: 60%;
  background: #c1b3df;
  writing-mode: vertical-rl;
}

.middle-school {
  left: 15%;
  top: 65%;
  width: 29%;
  height: 26%;
  background: #d8ead2;
}

.main-building {
  left: 46%;
  top: 65%;
  width: 22%;
  height: 26%;
  background: #cbdcf5;
}

.chapel {
  left: 75%;
  top: 34%;
  width: 18%;
  height: 27%;
  background: #f8d0a8;
}

.gym {
  left: 87%;
  top: 5%;
  width: 11%;
  height: 23%;
  background: #aeb7c1;
}

/* グラウンド */
.ground {
  position: absolute;
  z-index: 2;
  left: 70%;
  top: 65%;
  width: 28%;
  height: 29%;
  border: 4px solid #57924c;
  background: #85c96f;
  box-shadow: 4px 5px 0 rgba(0,0,0,.15);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
  font-size: clamp(12px, 1.5vw, 20px);
}

.field-lines {
  position: absolute;
  inset: 7%;
  border: 2px solid rgba(255,255,255,.9);
  pointer-events: none;
}

.field-lines::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  border-left: 2px solid white;
}

.field-lines::after {
  content: "";
  position: absolute;
  width: 22%;
  aspect-ratio: 1;
  left: 39%;
  top: 39%;
  border: 2px solid white;
  border-radius: 50%;
}

.ground-label {
  position: relative;
  z-index: 1;
  text-shadow: 1px 1px 3px #386c32;
}

/* 建物の階別画面 */
.floor-page {
  display: none;
  padding: 20px;
  background: #f5f5f0;
  color: #263d36;
  border: 4px solid #d7b76a;
  border-radius: 12px;
  min-height: 500px;
}

.back-button {
  padding: 10px 18px;
  border: 1px solid #d7b76a;
  border-radius: 7px;
  background: #234d52;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.floor-page h2 {
  text-align: center;
  margin: 20px 0;
  font-size: 28px;
}

.floor-buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

.floor-buttons button {
  padding: 10px 24px;
  border: 2px solid #62776b;
  border-radius: 7px;
  background: #e3e9df;
  color: #263d36;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.floor-buttons button.active-floor {
  background: #315e61;
  color: white;
  border-color: #315e61;
}

/* 間取り表示エリア */
.floor-content {
  width: 100%;
  min-height: 330px;
  padding: 25px;
  background: white;
  border: 2px solid #a4aaa2;
  border-radius: 8px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-size: 18px;
  color: #555;
}

/* スマホ対応 */
@media (max-width: 650px) {
  main {
    padding: 10px;
  }

  .map-frame {
    padding: 5px;
  }

  .map {
    min-height: 400px;
  }

  .building {
    border-width: 2px;
    font-size: 10px;
  }

  .ground {
    font-size: 10px;
  }

  .floor-page {
    padding: 12px;
  }

  .floor-page h2 {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<header>
  <h1>六浦祭 2026</h1>
  <p>FLOOR MAP</p>
</header>

<main>

  <!-- 全体マップ画面 -->
  <div id="map-page">

    <div class="toolbar">
      <button id="btn2d" class="active"
        onclick="setMapMode('2d')">
        2D MAP
      </button>

      <button id="btn3d"
        onclick="setMapMode('3d')">
        3D MAP
      </button>
    </div>

    <div class="map-frame">
      <div class="map" id="map">

        <div class="road horizontal"></div>

        <button class="building school-2"
          onclick="openBuilding('2号館')">
          2号館
        </button>

        <button class="building high-school"
          onclick="openBuilding('高校校舎')">
          高校校舎
        </button>

        <button class="building building-4"
          onclick="openBuilding('4号館')">
          4号館
        </button>

        <button class="building middle-school"
          onclick="openBuilding('中学校舎')">
          中学校舎
        </button>

        <button class="building main-building"
          onclick="openBuilding('本館')">
          本館<br>立入禁止
        </button>

        <button class="building chapel"
          onclick="openBuilding('礼拝堂')">
          礼拝堂
        </button>

        <button class="building gym"
          onclick="openBuilding('体育館')">
          体育館
        </button>

        <div class="ground">
          <div class="field-lines"></div>
          <span class="ground-label">グラウンド</span>
        </div>

      </div>
    </div>

  </div>

  <!-- 校舎の階別画面 -->
  <div class="floor-page" id="floor-page">

    <button class="back-button" onclick="backToMap()">
      ← 全体マップに戻る
    </button>

    <h2 id="floor-title"></h2>

    <div class="floor-buttons" id="floor-buttons"></div>

    <div class="floor-content" id="floor-content">
      間取りを準備中です。
    </div>

  </div>

</main>

<script>

/* 各校舎の階数 */
const buildingFloors = {
  "2号館": 4,
  "高校校舎": 3,
  "4号館": 3,
  "中学校舎": 4
};

let currentBuilding = "";
let currentFloor = 1;


/* 2D・3D切り替え */
function setMapMode(mode) {
  const map = document.getElementById("map");
  const btn2d = document.getElementById("btn2d");
  const btn3d = document.getElementById("btn3d");

  map.classList.toggle("is3d", mode === "3d");

  btn2d.classList.toggle("active", mode === "2d");
  btn3d.classList.toggle("active", mode === "3d");
}


/* 建物をクリックしたとき */
function openBuilding(name) {

  /* 本館 */
  if (name === "本館") {
    alert("文化祭当日は立ち入りできません。");
    return;
  }

  /* 礼拝堂 */
  if (name === "礼拝堂") {
    alert("礼拝堂には階層がありません。");
    return;
  }

  /* 体育館 */
  if (name === "体育館") {
    alert("体育館の内部表示はありません。");
    return;
  }

  /* グラウンド */
  if (name === "グラウンド") {
    alert("グラウンドの内部表示はありません。");
    return;
  }

  /* 校舎以外は処理しない */
  if (!buildingFloors[name]) {
    return;
  }

  currentBuilding = name;
  currentFloor = 1;

  /* 全体マップを隠す */
  document.getElementById("map-page").style.display = "none";

  /* 階別画面を表示 */
  document.getElementById("floor-page").style.display = "block";

  /* 最初は1階を表示 */
  showFloor(name, 1);
}


/* 階を切り替える */
function showFloor(name, floor) {

  currentBuilding = name;
  currentFloor = floor;

  document.getElementById("floor-title").textContent =
    name + " " + floor + "F";

  const buttons = document.getElementById("floor-buttons");
  buttons.innerHTML = "";

  /* 階数ボタンを作成 */
  for (let i = 1; i <= buildingFloors[name]; i++) {

    const button = document.createElement("button");

    button.textContent = i + "F";

    if (i === floor) {
      button.classList.add("active-floor");
    }

    button.onclick = function() {
      showFloor(name, i);
    };

    buttons.appendChild(button);
  }

  /* 間取り表示 */
  const content = document.getElementById("floor-content");

  if (name === "中学校舎") {
    content.textContent =
      "中学校舎 " + floor + "F の間取りをここに表示します。";
  } else {
    content.textContent =
      name + " " + floor + "F の間取りは準備中です。";
  }
}


/* 全体マップに戻る */
function backToMap() {

  document.getElementById("floor-page").style.display = "none";

  document.getElementById("map-page").style.display = "block";
}

</script>

</body>
</html>
