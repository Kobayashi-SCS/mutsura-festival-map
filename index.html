
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六浦祭2026 フロアマップ</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Noto Sans JP", sans-serif;
  color: #26352b;
  background: #f1f4ef;
}

header {
  padding: 20px;
  text-align: center;
  background: #254d3b;
  color: white;
}

header h1 { margin: 0; font-size: 25px; }
header p { margin: 6px 0 0; font-size: 13px; }

main {
  width: min(1200px, 96%);
  margin: 24px auto;
}

.panel {
  background: white;
  padding: 18px;
  border-radius: 15px;
  box-shadow: 0 3px 12px #00000012;
}

.panel-title, .floor-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 15px;
}

.panel-title h2, .floor-header h2 {
  margin: 0;
  font-size: 21px;
}

button {
  border: none;
  border-radius: 9px;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.mode-button, .map-control, .back-button {
  background: #e8eee8;
  color: #315340;
}

.mode-button.active, .floor-button.active {
  background: #315b42;
  color: white;
}

.map-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
}

.map-controls {
  display: flex;
  gap: 6px;
  align-items: center;
}

.map-controls button {
  min-width: 42px;
  background: #e8eee8;
  color: #315340;
}

#zoomLevel {
  min-width: 48px;
  text-align: center;
  font-size: 13px;
  color: #647368;
}

#mapArea {
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
  background: #d4edbb;
  perspective: 1200px;
  touch-action: none;
  cursor: grab;
  position: relative;
}

#mapArea.dragging { cursor: grabbing; }

#campusMap {
  width: 100%;
  display: block;
  transform-origin: center center;
  transition: none;
  will-change: transform;
  user-select: none;
}

.building { cursor: pointer; }

.building:hover {
  filter: brightness(1.08) drop-shadow(0 5px 5px #0005);
}

.building text {
  font-size: 25px;
  font-weight: bold;
  fill: #26332d;
  text-anchor: middle;
  pointer-events: none;
}

.map-hint {
  margin: 12px 0 0;
  color: #6b786e;
  font-size: 13px;
}

#floorScreen {
  display: none;
  margin-top: 20px;
}

#floorScreen.visible { display: block; }

.floor-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}

.floor-button {
  background: #e8eee8;
  color: #315340;
}

#floorPlan {
  width: 100%;
  min-height: 300px;
  padding: 16px;
  overflow: hidden;
  border: 2px solid #dce4dc;
  border-radius: 12px;
  background: #f7f8f5;
}

.school-plan {
  max-width: 850px;
  margin: auto;
  border: 3px solid #64756a;
  background: white;
}

.plan-facilities {
  display: grid;
  grid-template-columns: 1fr 1.3fr 1fr 1fr 1.3fr 1fr;
  min-height: 105px;
}

.facility {
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 8px 3px;
  border: 1px solid #aab5ac;
  background: #edf0ec;
  font-size: 13px;
  font-weight: bold;
}

.facility.stairs { background: #d7dce0; }
.facility.women { background: #f6dce8; }
.facility.men { background: #dce9f7; }
.facility.elevator { background: #e9e1f4; }

.corridor {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 48px;
  border-top: 2px solid #9da69e;
  border-bottom: 2px solid #9da69e;
  background: #f0eee4;
  color: #566057;
  font-weight: bold;
  letter-spacing: 2px;
}

.plan-lower {
  display: grid;
  min-height: 220px;
}

.room {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 90px;
  padding: 10px;
  border: 1px solid #9eaaa0;
  text-align: center;
  font-size: 14px;
  font-weight: bold;
}

.room.storage { background: #e0e0dc; }
.room.pink { background: #f5dce8; }
.room.blue { background: #dce9f7; }
.room.yellow { background: #f7edc9; }
.room.green { background: #dcefdc; }
.room.purple { background: #e9e0f3; }
.room.gray { background: #e0e2df; color: #6c746e; }

.room.large { min-height: 220px; }

.room-stack {
  display: grid;
  grid-template-rows: 1fr 1fr;
}

.room-stack .room { min-height: 100px; }

.generic-plan {
  max-width: 750px;
  margin: auto;
  border: 3px solid #65766a;
  background: white;
}

.generic-rooms {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}

.generic-rooms .room { min-height: 160px; }

.notice, .floor-message {
  padding: 28px 15px;
  margin-top: 15px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
}

.notice {
  background: #fff5df;
  color: #735b26;
}

.floor-message {
  background: #f0f4ef;
  color: #52645a;
}

@media (max-width: 600px) {
  main { width: 94%; margin: 14px auto; }
  .panel { padding: 12px; }
  header h1 { font-size: 20px; }
  .facility { font-size: 10px; padding: 5px 1px; }
  .plan-facilities { min-height: 85px; }
  .room { font-size: 11px; padding: 5px; }
  .plan-lower { min-height: 170px; }
  .room.large { min-height: 170px; }
}
</style>
</head>

<script>

const buildingFloors = {
  "2号館": 4,
  "高校校舎": 3,
  "4号館": 3,
  "中学校舎": 4
};

let currentBuilding = "";
let currentFloor = 1;

let mapZoom = 1;
let mapX = 0;
let mapY = 0;
let map3d = false;

let dragging = false;
let dragMoved = false;
let startX = 0;
let startY = 0;
let suppressClick = false;

const mapArea = document.getElementById("mapArea");
const campusMap = document.getElementById("campusMap");

function updateMap() {
  const angle = map3d ? 32 : 0;

  campusMap.style.transform =
    `translate(${mapX}px, ${mapY}px) scale(${mapZoom}) rotateX(${angle}deg)`;

  document.getElementById("zoomLevel").textContent =
    Math.round(mapZoom * 100) + "%";
}

function changeMode(mode) {
  map3d = mode === "3d";

  document.getElementById("mode2d").classList.toggle(
    "active", !map3d
  );

  document.getElementById("mode3d").classList.toggle(
    "active", map3d
  );

  updateMap();
}

function zoomMap(amount, centerX = null, centerY = null) {
  const oldZoom = mapZoom;
  const newZoom = Math.max(0.7, Math.min(4, oldZoom * amount));

  if (centerX !== null && centerY !== null) {
    const rect = mapArea.getBoundingClientRect();

    const px = centerX - (rect.left + rect.width / 2);
    const py = centerY - (rect.top + rect.height / 2);

    mapX = px - (px - mapX) * (newZoom / oldZoom);
    mapY = py - (py - mapY) * (newZoom / oldZoom);
  }

  mapZoom = newZoom;
  updateMap();
}

function resetMap() {
  mapZoom = 1;
  mapX = 0;
  mapY = 0;
  updateMap();
}

/* マウスホイール・タッチパッド */
mapArea.addEventListener("wheel", (e) => {
  e.preventDefault();

  const amount = e.deltaY < 0 ? 1.1 : 0.9;

  zoomMap(amount, e.clientX, e.clientY);
}, { passive: false });

/* ドラッグによる移動 */
mapArea.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 && e.pointerType === "mouse") return;

  dragging = true;
  dragMoved = false;

  startX = e.clientX - mapX;
  startY = e.clientY - mapY;

  mapArea.classList.add("dragging");
});

mapArea.addEventListener("pointermove", (e) => {
  if (!dragging) return;

  const nextX = e.clientX - startX;
  const nextY = e.clientY - startY;

  if (Math.abs(nextX - mapX) > 2 ||
      Math.abs(nextY - mapY) > 2) {
    dragMoved = true;
  }

  mapX = nextX;
  mapY = nextY;

  updateMap();
});

function stopDragging() {
  if (!dragging) return;

  dragging = false;
  mapArea.classList.remove("dragging");

  if (dragMoved) {
    suppressClick = true;
  }
}

mapArea.addEventListener("pointerup", stopDragging);
mapArea.addEventListener("pointercancel", stopDragging);

/* ドラッグ直後に建物がクリックされないようにする */
campusMap.addEventListener("click", (e) => {
  if (suppressClick) {

/* スマホのピンチ操作 */
let pinchStartDistance = 0;
let pinchStartZoom = 1;

mapArea.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    pinchStartDistance = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );

    pinchStartZoom = mapZoom;
  }
}, { passive: true });

mapArea.addEventListener("touchmove", (e) => {
  if (e.touches.length !== 2) return;

  e.preventDefault();

  const distance = Math.hypot(
    e.touches[0].clientX - e.touches[1].clientX,
    e.touches[0].clientY - e.touches[1].clientY
  );

  if (pinchStartDistance > 0) {
    const centerX =
      (e.touches[0].clientX + e.touches[1].clientX) / 2;

    const centerY =
      (e.touches[0].clientY + e.touches[1].clientY) / 2;

    const targetZoom = Math.max(
      0.7,
      Math.min(4, pinchStartZoom * distance / pinchStartDistance)
    );

    const amount = targetZoom / mapZoom;
    zoomMap(amount, centerX, centerY);
  }
}, { passive: false });

/* 建物をクリックしたとき */
function openBuilding(name) {

  if (name === "体育館" || name === "グラウンド") {
    return;
  }

  currentBuilding = name;
  currentFloor = 1;

  document.getElementById("mapScreen").style.display = "none";
  document.getElementById("floorScreen").classList.add("visible");

  document.getElementById("buildingTitle").textContent = name;

  const buttons = document.getElementById("floorButtons");
  const plan = document.getElementById("floorPlan");
  const notice = document.getElementById("specialNotice");

  buttons.innerHTML = "";
  plan.innerHTML = "";
  notice.innerHTML = "";

  if (name === "本館") {
    notice.innerHTML =
      '<div class="notice">文化祭当日は立ち入りできません。</div>';
    return;
  }

  if (name === "礼拝堂") {
    plan.innerHTML =
      '<div class="floor-message">礼拝堂には階層がありません。</div>';
    return;
  }

  createFloorButtons();
  showFloor(1);
}

function createFloorButtons() {
  const count = buildingFloors[currentBuilding];
  const area = document.getElementById("floorButtons");

  area.innerHTML = "";

  for (let i = 1; i <= count; i++) {
    const button = document.createElement("button");

    button.className =
      "floor-button" + (i === 1 ? " active" : "");

    button.textContent = i + "階";
    button.id = "floorButton" + i;
    button.onclick = () => showFloor(i);

    area.appendChild(button);
  }
}

function showFloor(floor) {
  currentFloor = floor;

  document.querySelectorAll(".floor-button").forEach(button => {
    button.classList.remove("active");
  });

  const activeButton =
    document.getElementById("floorButton" + floor);

  if (activeButton) activeButton.classList.add("active");

  const plan = document.getElementById("floorPlan");

  if (currentBuilding === "中学校舎") {
    plan.innerHTML = middleSchoolPlan(floor);
  } else {
    plan.innerHTML = genericPlan(currentBuilding, floor);
  }
}

/* 中学校舎の間取り */
function middleSchoolPlan(floor) {
  let lower = "";

  if (floor === 1) {
    lower = `
      <div class="plan-lower"
        style="grid-template-columns:1fr 1fr 1fr 1fr 1fr;">
        <div class="room storage">下駄箱</div>
        <div class="room pink">テキスト挿入予定</div>
        <div class="room blue">テキスト挿入予定</div>
        <div class="room yellow">テキスト挿入予定</div>
        <div class="room green">テキスト挿入予定</div>
      </div>`;
  }

  if (floor === 2) {
    lower = `
      <div class="plan-lower" style="grid-template-columns:1fr;">
        <div class="room green large">テキスト挿入予定</div>
      </div>`;
  }

  if (floor === 3) {
    lower = `
      <div class="plan-lower" style="grid-template-columns:1fr;">
        <div class="room pink large">テキスト挿入予定</div>
      </div>`;
  }

  if (floor === 4) {
    lower = `
      <div class="plan-lower"
        style="grid-template-columns:1fr 1fr 1fr 1fr 1fr;">

        <div class="room gray">使用しない</div>

        <div class="room-stack">
          <div class="room blue">テキスト挿入予定</div>
          <div class="room yellow">テキスト挿入予定</div>
        </div>

        <div class="room-stack">
          <div class="room pink">テキスト挿入予定</div>
          <div class="room green">テキスト挿入予定</div>
        </div>

        <div class="room-stack">
          <div class="room yellow">テキスト挿入予定</div>
          <div class="room purple">テキスト挿入予定</div>
        </div>

        <div class="room gray">使用しない</div>
      </div>`;
  }

  return `
    <div class="school-plan">
      <div class="plan-facilities">
        <div class="facility stairs">階段</div>
        <div class="facility women">女子トイレ</div>
        <div class="facility elevator">エレベーター</div>
        <div class="facility men">男子トイレ</div>
        <div class="facility">通路</div>

  document.getElementById("floorButtons").innerHTML = "";
  document.getElementById("floorPlan").innerHTML = "";

}
