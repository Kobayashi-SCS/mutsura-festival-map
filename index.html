<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六浦祭2026 フロアマップ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Noto Sans JP", sans-serif;
  background: #102d32;
  color: white;
}

header {
  padding: 22px;
  text-align: center;
  background: #173e43;
  border-bottom: 3px solid #d7b76a;
}

header h1 {
  margin: 0;
  color: #f4d98b;
  font-size: 28px;
}

header p {
  margin: 7px 0 0;
  color: #d8e7e5;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.toolbar {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 18px;
}

.toolbar button {
  padding: 10px 25px;
  border: 1px solid #d7b76a;
  border-radius: 8px;
  background: #234d52;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.toolbar button.active {
  background: #d7b76a;
  color: #18383c;
  font-weight: bold;
}

.map-frame {
  overflow: hidden;
  background: #e9eee8;
  border: 4px solid #d7b76a;
  border-radius: 12px;
  padding: 15px;
}

.map {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 2;
  min-height: 500px;
  background: #c8d9c6;
  border: 3px solid #6e8172;
  overflow: hidden;
  transition: transform .5s;
}

.map::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, transparent 49%, #b7cbb4 50%, transparent 51%),
    linear-gradient(0deg, transparent 49%, #b7cbb4 50%, transparent 51%);
  opacity: .35;
}

.map.is3d {
  transform: perspective(1100px) rotateX(22deg) scale(.92);
  transform-origin: center center;
}

.building {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  border: 4px solid #52615a;
  border-radius: 5px;
  color: #263d36;
  font-weight: bold;
  font-size: clamp(12px, 1.5vw, 20px);
  cursor: pointer;
  box-shadow: 3px 4px 0 rgba(0,0,0,.15);
  transition: .2s;
  z-index: 2;
}

.building:hover {
  filter: brightness(1.08);
  transform: translateY(-3px);
}

.school {
  background: #f0e6c9;
}

.main-building {
  background: #c9c9c9;
}

.chapel {
  background: #e8d9f1;
}

.gym {
  background: #b9c8d1;
}

.ground {
  background: #8dbb7b;
  border-color: #547c4b;
  color: #173d24;
}

.field-lines {
  position: absolute;
  inset: 8%;
  border: 2px solid rgba(255,255,255,.8);
}

.field-lines::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  height: 100%;
  border-left: 2px solid rgba(255,255,255,.8);
}

.field-lines::after {
  content: "";
  position: absolute;
  width: 22%;
  aspect-ratio: 1;
  border: 2px solid rgba(255,255,255,.8);
  border-radius: 50%;
  left: 39%;
  top: 39%;
}

.road {
  position: absolute;
  background: #929a98;
  border: 2px solid #747c79;
  z-index: 1;
}

.road.horizontal {
  left: 0;
  top: 48%;
  width: 100%;
  height: 5%;
}

.road.vertical {
  left: 47%;
  top: 0;
  width: 5%;
  height: 100%;
}

.map-label {
  position: absolute;
  z-index: 1;
  color: #45604b;
  font-weight: bold;
  font-size: clamp(12px, 1.3vw, 17px);
}

.panel {
  margin-top: 20px;
  padding: 20px;
  background: #173e43;
  border: 1px solid #d7b76a;
  border-radius: 10px;
  min-height: 140px;
}

.panel h2 {
  margin-top: 0;
  color: #f4d98b;
}

.floor-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.floor-buttons button {
  padding: 9px 18px;
  border: 1px solid #d7b76a;
  border-radius: 6px;
  background: #315e61;
  color: white;
  cursor: pointer;
}

.floor-buttons button:hover {
  background: #d7b76a;
  color: #18383c;
}

#floor-info {
  margin-top: 15px;
  padding: 15px;
  background: #244b50;
  border-radius: 8px;
  min-height: 45px;
}

@media (max-width: 650px) {
  main {
    padding: 10px;
  }

  .map-frame {
    padding: 6px;
  }

  .map {
    min-height: 400px;
  }

  .building {
    border-width: 2px;
    font-size: 11px;
  }
}
</style>
</head>

<body>

<header>
  <h1>六浦祭 2026</h1>
  <p>FLOOR MAP</p>
</header>

<main>

  <div class="toolbar">
    <button id="btn2d" class="active" onclick="setMapMode('2d')">2D MAP</button>
    <button id="btn3d" onclick="setMapMode('3d')">3D MAP</button>
  </div>

  <div class="map-frame">
    <div class="map" id="map">

      <div class="road horizontal"></div>
      <div class="road vertical"></div>

      <div class="map-label" style="left:3%;top:4%;">校舎エリア</div>

      <button class="building school"
        style="left:16.3%;top:2.8%;width:34.8%;height:27.5%;"
        onclick="openBuilding('2号館')">
        2号館
      </button>

      <button class="building school"
        style="left:51.7%;top:3.7%;width:34.4%;height:27%;"
        onclick="openBuilding('高校校舎')">
        高校校舎
      </button>

      <button class="building school"
        style="left:2.2%;top:28%;width:10.6%;height:64%;"
        onclick="openBuilding('4号館')">
        4号館
      </button>

      <button class="building school"
        style="left:15.4%;top:67%;width:35.2%;height:26%;"
        onclick="openBuilding('中学校舎')">
        中学校舎
      </button>

      <button class="building main-building"
        style="left:56.8%;top:67.5%;width:28.6%;height:24%;"
        onclick="openBuilding('本館')">
        本館
        <br>
        <small>立入禁止</small>
      </button>

      <button class="building chapel"
        style="left:79.1%;top:35%;width:19.7%;height:60%;"
        onclick="openBuilding('礼拝堂')">
        礼拝堂
      </button>

      <button class="building gym"
        style="left:87%;top:2%;width:11%;height:24%;"
        onclick="openBuilding('体育館')">
        体育館
      </button>

      <button class="building ground"
        style="left:70%;top:35%;width:27%;height:28%;"
        onclick="openBuilding('グラウンド')">
        <div class="field-lines"></div>
        グラウンド
      </button>

    </div>
  </div>

  <section class="panel">
    <h2 id="panel-title">建物を選択してください</h2>
    <p id="panel-description">
      マップ上の建物をクリックすると、詳細が表示されます。
    </p>

    <div class="floor-buttons" id="floor-buttons"></div>
    <div id="floor-info"></div>
  </section>

</main>

<script>
const buildingFloors = {
  "2号館": 4,
  "高校校舎": 3,
  "4号館": 3,
  "中学校舎": 4
};

function setMapMode(mode) {
  const map = document.getElementById("map");
  const btn2d = document.getElementById("btn2d");
  const btn3d = document.getElementById("btn3d");

  if (mode === "3d") {
    map.classList.add("is3d");
    btn3d.classList.add("active");
    btn2d.classList.remove("active");
  } else {
    map.classList.remove("is3d");
    btn2d.classList.add("active");
    btn3d.classList.remove("active");
  }
}

function openBuilding(name) {
  const title = document.getElementById("panel-title");
  const description = document.getElementById("panel-description");
  const buttons = document.getElementById("floor-buttons");
  const info = document.getElementById("floor-info");

  title.textContent = name;
  buttons.innerHTML = "";
  info.textContent = "";

  if (name === "本館") {
    description.textContent = "文化祭当日は立ち入りできません。";
    return;
  }

  if (name === "礼拝堂") {
    description.textContent = "礼拝堂には階層がありません。";
    return;
  }

  if (name === "体育館") {
    description.textContent = "体育館の内部情報は表示しません。";
    return;
  }

  if (name === "グラウンド") {
    description.textContent = "グラウンドの内部情報は表示しません。";
    return;
  }

  const floors = buildingFloors[name];

  if (!floors) {
    description.textContent = "詳細情報は準備中です。";
    return;
  }

  description.textContent = "表示する階を選択してください。";

  for (let i = 1; i <= floors; i++) {
    const button = document.createElement("button");
    button.textContent = i + "F";
    button.onclick = () => showFloor(name, i);
    buttons.appendChild(button);
  }
}

function showFloor(name, floor) {
  const info = document.getElementById("floor-info");

  info.textContent = name + " " + floor + "F の間取りは準備中です。";
}
</script>

</body>
</html>
