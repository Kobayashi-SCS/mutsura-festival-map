
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六浦祭2026 校内マップ</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  color: #fff;
  font-family: sans-serif;
  background: #172d35;
}

header {
  text-align: center;
  padding: 24px 12px;
  background: #203e4b;
  border-bottom: 4px solid #e5bd70;
}

header h1 {
  margin: 0;
  color: #f5d58e;
  letter-spacing: 3px;
}

header p { margin-bottom: 0; }

main {
  max-width: 1100px;
  margin: auto;
  padding: 20px 12px;
}

h2 {
  text-align: center;
  color: #f5d58e;
}

.map-frame {
  padding: 12px;
  border: 3px solid #d5bd79;
  border-radius: 14px;
  background: #284c3e;
  box-shadow: 0 8px 0 #102a25;
}

.map {
  position: relative;
  width: 100%;
  aspect-ratio: 1365 / 768;
  overflow: hidden;
  border: 3px solid #42664a;
  border-radius: 8px;
  background:
    radial-gradient(ellipse, #73965a 1%, transparent 70%),
    repeating-linear-gradient(45deg, #527b4c 0 20px, #5b8552 20px 40px);
}

.path {
  position: absolute;
  background: #d8c69a;
  border: 2px solid #a9956d;
  border-radius: 20px;
  opacity: .95;
}

.path.horizontal {
  left: 12%;
  top: 47%;
  width: 76%;
  height: 8%;
}

.path.vertical {
  left: 47%;
  top: 28%;
  width: 7%;
  height: 66%;
}

.building {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  border: 3px solid rgba(45, 45, 45, .75);
  border-radius: 5px;
  color: #26323a;
  font-size: clamp(10px, 2vw, 24px);
  font-weight: bold;
  text-shadow: 0 1px 0 rgba(255,255,255,.5);
  cursor: pointer;
  box-shadow: 7px 8px 0 rgba(0,0,0,.35);
  transition: transform .15s, filter .15s;
  z-index: 2;
}

.building:hover {
  transform: translateY(-5px);
  filter: brightness(1.1);
}

.building small {
  margin-top: 6px;
  font-size: clamp(7px, 1vw, 12px);
}

.b2 {
  left: 16.3%; top: 2.8%;
  width: 34.8%; height: 27.5%;
  background: #f5df9e;
}

.high {
  left: 51.7%; top: 3.7%;
  width: 34.4%; height: 27%;
  background: #e9aaaa;
}

.b4 {
  left: 2.2%; top: 28%;
  width: 10.6%; height: 64%;
  background: #b7a6d8;
}

.middle {
  left: 15.4%; top: 67%;
  width: 35.2%; height: 26%;
  background: #c5dfbd;
}

.main-building {
  left: 56.8%; top: 67.5%;
  width: 28.6%; height: 24%;
  background: #a9c5eb;
}

.chapel {
  left: 79.1%; top: 35%;
  width: 19.7%; height: 60%;
  background: #f3bd8b;
}

.panel {
  display: none;
  margin-top: 24px;
  padding: 20px;
  background: #203e4b;
  border: 2px solid #e5bd70;
  border-radius: 12px;
}

.panel h2 { color: #f5d58e; }

.floor-button, .back-button {
  margin: 5px;
  padding: 10px 16px;
  border: 1px solid #e5bd70;
  border-radius: 7px;
  background: #496c65;
  color: white;
  cursor: pointer;
}

#floor-info {
  margin: 16px 0;
  padding: 15px;
  background: #172b35;
  border-radius: 8px;
  line-height: 1.8;
}

footer {
  text-align: center;
  padding: 20px;
  color: #b9c9c9;
}
</style>
</head>

<body>
<header>
  <h1>六浦祭 2026</h1>
  <p>AMBITION MAP — 校内案内</p>
</header>

<main>
  <h2>◆ CAMPUS MAP ◆</h2>
  <p style="text-align:center">建物を選択して、校内を探索しよう！</p>

  <div class="map-frame">
    <div class="map">
      <div class="path horizontal"></div>
      <div class="path vertical"></div>

      <button class="building b2" onclick="openBuilding('2号館')">
        2号館<small>BUILDING 02</small>
      </button>

      <button class="building high" onclick="openBuilding('高校校舎')">
        高校校舎<small>HIGH SCHOOL</small>
      </button>

      <button class="building b4" onclick="openBuilding('4号館')">
        4号館<small>BUILDING 04</small>
      </button>

      <button class="building middle" onclick="openBuilding('中学校舎')">
        中学校舎<small>JUNIOR HIGH</small>
      </button>

      <button class="building main-building" onclick="openBuilding('本館')">
        本館<small>MAIN BUILDING</small>
      </button>

      <button class="building chapel" onclick="openBuilding('礼拝堂')">
        礼拝堂<small>CHAPEL</small>
      </button>
    </div>
  </div>

  <section class="panel" id="building-panel">
    <h2 id="building-name"></h2>
    <p>探索する階を選択してください。</p>
    <div id="floor-buttons"></div>
    <div id="floor-info">
      階を選ぶと、教室情報が表示されます。
    </div>
    <button class="back-button" onclick="closeBuilding()">
      ← マップに戻る
    </button>
  </section>
</main>

<footer>六浦祭2026 校内マップ</footer>

<script>
const buildingFloors = {
  "2号館": 4,
  "高校校舎": 3,
  "4号館": 3,
  "中学校舎": 4
};

function openBuilding(name) {
  const panel = document.getElementById("building-panel");
  const title = document.getElementById("building-name");
  const buttons = document.getElementById("floor-buttons");
  const info = document.getElementById("floor-info");
  const description = panel.querySelector("p");

  panel.style.display = "block";
  title.textContent = name;
  buttons.innerHTML = "";

  // 本館：立入禁止
  if (name === "本館") {
    description.textContent = "文化祭当日は立ち入りできません。";
    info.textContent = "この建物は立入禁止です。";
  }

  // 礼拝堂：階層なし
  else if (name === "礼拝堂") {
    description.textContent = "礼拝堂の案内";
    info.textContent = "礼拝堂には階層がありません。";
  }

  // その他の校舎：階を選択
  else {
    description.textContent = "探索する階を選択してください。";

    const floorCount = buildingFloors[name];

    for (let i = 1; i <= floorCount; i++) {
      const floor = i + "階";
      const button = document.createElement("button");

      button.className = "floor-button";
      button.textContent = floor;
      button.onclick = () => showFloor(name, floor);

      buttons.appendChild(button);
    }

    info.textContent = "階を選ぶと、教室情報が表示されます。";
  }

  panel.scrollIntoView({ behavior: "smooth" });
}

function showFloor(name, floor) {
  document.getElementById("floor-info").textContent =
    name + " " + floor + " の教室情報は、これから追加します。";
}

function closeBuilding() {
  document.getElementById("building-panel").style.display = "none";
}
</script>


</body>
</html>
