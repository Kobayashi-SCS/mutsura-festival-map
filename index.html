
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六浦祭2026 校内マップ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: #fff;
  font-family: sans-serif;
  background: #172d35;
}

header {
  text-align: center;
  padding: 24px 12px;
  background: #203e4b;
  border-bottom: 4px solid #e5bd70;
}

header h1 {
  margin: 0;
  color: #f5d58e;
  letter-spacing: 3px;
}

header p {
  margin-bottom: 0;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 20px 12px;
}

h2 {
  text-align: center;
  color: #f5d58e;
}

/* マップ外枠 */
.map-frame {
  padding: 12px;
  border: 3px solid #d5bd79;
  border-radius: 14px;
  background: #284c3e;
  box-shadow: 0 8px 0 #102a25;
}

/* 全体マップ */
.map {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  border: 3px solid #42664a;
  border-radius: 8px;
  background:
    radial-gradient(ellipse, #b8df91 1%, transparent 75%),
    #c6e8a7;
}

/* 建物共通 */
.building {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  border: 3px solid rgba(45,45,45,.65);
  border-radius: 5px;
  color: #26323a;
  font-size: clamp(10px, 1.8vw, 22px);
  font-weight: bold;
  text-shadow: 0 1px 0 rgba(255,255,255,.5);
  cursor: pointer;
  box-shadow: 6px 7px 0 rgba(0,0,0,.25);
  z-index: 3;
}

.building:hover {
  filter: brightness(1.1);
}

.building small {
  margin-top: 5px;
  font-size: clamp(7px, 1vw, 12px);
}

/* 2号館：左上 */
.b2 {
  left: 15%;
  top: 4%;
  width: 30%;
  height: 19%;
  background: #f5df9e;
}

/* 高校校舎：右上 */
.high {
  left: 49%;
  top: 4%;
  width: 27%;
  height: 19%;
  background: #e9aaaa;
}

/* 体育館：右上端 */
.gym {
  left: 79%;
  top: 4%;
  width: 18%;
  height: 19%;
  background: #a9a4aa;
}

/* 4号館：左端 */
.b4 {
  left: 2%;
  top: 27%;
  width: 10%;
  height: 29%;
  background: #b7a6d8;
  writing-mode: vertical-rl;
}

/* 中学校舎：左下寄り */
.middle {
  left: 15%;
  top: 29%;
  width: 30%;
  height: 22%;
  background: #c5dfbd;
}

/* 本館：中央下寄り */
.main-building {
  left: 49%;
  top: 29%;
  width: 27%;
  height: 22%;
  background: #a9c5eb;
}

/* 礼拝堂：右端 */
.chapel {
  left: 79%;
  top: 27%;
  width: 18%;
  height: 29%;
  background: #f3bd8b;
}

/* 道路 */
.campus-road {
  position: absolute;
  left: 0;
  top: 58%;
  width: 100%;
  height: 8%;
  background: #999da2;
  border-top: 3px solid #d7d7d7;
  border-bottom: 3px solid #d7d7d7;
  z-index: 1;
}

.road-line {
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  border-top: 3px dashed white;
}

/* グラウンド */
.ground {
  position: absolute;
  left: 12%;
  top: 70%;
  width: 86%;
  height: 27%;
  padding: 2%;
  background: #79c66a;
  border: 4px solid #5b9e50;
  border-radius: 9px;
  z-index: 1;
}

.ground-line {
  position: relative;
  width: 100%;
  height: 82%;
  border: 3px solid white;
}

.center-line {
  position: absolute;
  left: 50%;
  top: 0;
  height: 100%;
  border-left: 3px solid white;
}

.center-circle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 16%;
  aspect-ratio: 1;
  border: 3px solid white;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

.goal {
  position: absolute;
  top: 30%;
  width: 10%;
  height: 40%;
  border: 3px solid white;
}

.left-goal {
  left: 0;
}

.right-goal {
  right: 0;
}

.ground span {
  display: block;
  text-align: center;
  color: white;
  font-weight: bold;
  font-size: clamp(9px, 1.4vw, 16px);
  text-shadow: 1px 1px 3px #333;
  margin-top: 3px;
}

/* 情報パネル */
.panel {
  display: none;
  margin-top: 24px;
  padding: 20px;
  background: #203e4b;
  border: 2px solid #e5bd70;
  border-radius: 12px;
}

.panel h2 {
  color: #f5d58e;
}

.floor-button,
.back-button {
  margin: 5px;
  padding: 10px 16px;
  border: 1px solid #e5bd70;
  border-radius: 7px;
  background: #496c65;
  color: white;
  cursor: pointer;
}

.floor-button:hover,
.back-button:hover {
  background: #668c7d;
}

#floor-info {
  margin: 16px 0;
  padding: 15px;
  background: #172b35;
  border-radius: 8px;
  line-height: 1.8;
}

footer {
  text-align: center;
  padding: 20px;
  color: #b9c9c9;
}
</style>
</head>

<body>

<header>
  <h1>六浦祭 2026</h1>
  <p>AMBITION MAP — 校内案内</p>
</header>

<main>

<h2>◆ CAMPUS MAP ◆</h2>
<p style="text-align:center">
  建物を選択して、校内を探索しよう！
</p>

<div class="map-frame">
  <div class="map">

    <!-- 校舎 -->
    <button class="building b2"
      onclick="openBuilding('2号館')">
      2号館
      <small>BUILDING 02</small>
    </button>

    <button class="building high"
      onclick="openBuilding('高校校舎')">
      高校校舎
      <small>HIGH SCHOOL</small>
    </button>

    <button class="building b4"
      onclick="openBuilding('4号館')">
      4号館
      <small>BUILDING 04</small>
    </button>

    <button class="building middle"
      onclick="openBuilding('中学校舎')">
      中学校舎
      <small>JUNIOR HIGH</small>
    </button>

    <button class="building main-building"
      onclick="openBuilding('本館')">
      本館
      <small>NO ENTRY</small>
    </button>

    <button class="building chapel"
      onclick="openBuilding('礼拝堂')">
      礼拝堂
      <small>CHAPEL</small>
    </button>

    <!-- 体育館 -->
    <button class="building gym"
      onclick="openBuilding('体育館')">
      体育館
      <small>GYMNASIUM</small>
    </button>

    <!-- 道路 -->
    <div class="campus-road">
      <div class="road-line"></div>
    </div>

    <!-- グラウンド -->
    <div class="ground">
      <div class="ground-line">
        <div class="center-circle"></div>
        <div class="center-line"></div>
        <div class="goal left-goal"></div>
        <div class="goal right-goal"></div>
      </div>
      <span>グラウンド</span>
    </div>

  </div>
</div>

<!-- 建物情報 -->
<section class="panel" id="building-panel">

  <h2 id="building-name"></h2>

  <p id="building-description">
    探索する階を選択してください。
  </p>

  <div id="floor-buttons"></div>

  <div id="floor-info">
    階を選ぶと、教室情報が表示されます。
  </div>

  <button class="back-button" onclick="closeBuilding()">
    ← マップに戻る
  </button>

</section>

</main>

<footer>
  六浦祭2026 校内マップ
</footer>

<script>

// 建物ごとの階数
const buildingFloors = {
  "2号館": 4,
  "高校校舎": 3,
  "4号館": 3,
  "中学校舎": 4
};

// 建物を選択したとき
function openBuilding(name) {

  const panel = document.getElementById("building-panel");
  const title = document.getElementById("building-name");
  const buttons = document.getElementById("floor-buttons");
  const info = document.getElementById("floor-info");
  const description = document.getElementById("building-description");

  panel.style.display = "block";
  title.textContent = name;
  buttons.innerHTML = "";

  // 本館
  if (name === "本館") {
    description.textContent =
      "文化祭当日は立ち入りできません。";
    info.textContent =
      "この建物は立入禁止です。";
  }

  // 礼拝堂
  else if (name === "礼拝堂") {
    description.textContent = "礼拝堂の案内";
    info.textContent =
      "礼拝堂には階層がありません。";
  }

  // 体育館
  else if (name === "体育館") {
    description.textContent = "体育館の案内";
    info.textContent =
      "体育館の詳細情報は、これから追加します。";
  }

  // その他の校舎
  else {
    description.textContent =
      "探索する階を選択してください。";

    const floorCount = buildingFloors[name];

    for (let i = 1; i <= floorCount; i++) {
      const floor = i + "階";
      const button = document.createElement("button");

      button.className = "floor-button";
      button.textContent = floor;
      button.onclick = () => showFloor(name, floor);

      buttons.appendChild(button);
    }

    info.textContent =
      "階を選ぶと、教室情報が表示されます。";
  }

  panel.scrollIntoView({
    behavior: "smooth"
  });
}

// 階を選択したとき
function showFloor(name, floor) {
  document.getElementById("floor-info").textContent =
    name + " " + floor +
    " の教室情報は、これから追加します。";
}

// マップに戻る
function closeBuilding() {
  document.getElementById("building-panel").style.display =
    "none";
}

</script>

</body>
</html>
